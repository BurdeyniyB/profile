<footer class="footer">
  <div class="inner">
    <div class="top">
      <div class="brand">
        <span class="name">Borys Burdeinyi</span>
        <span class="role">Full-Stack Developer</span>
      </div>
      <nav class="nav">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#approach">Approach</a>
        <a href="#services">Services</a>
        <a href="#projects">Projects</a>
        <a href="#contact" *ngIf="config.showContacts">Contact</a>
      </nav>
    </div>

    <div class="divider"></div>

    <div class="bottom">
      <span class="copy">© 2025 Borys Burdeinyi. All rights reserved.</span>
      <div class="socials" *ngIf="config.showContacts">
        <a [href]="'https://t.me/' + config.contacts.telegram" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
          <i class="ri-telegram-line"></i>
        </a>
        <a [href]="'https://wa.me/' + config.contacts.whatsapp" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
          <i class="ri-whatsapp-line"></i>
        </a>
        <a [href]="'mailto:' + config.contacts.email" aria-label="Email">
          <i class="ri-mail-line"></i>
        </a>
      </div>
    </div>
  </div>
</footer>
